name: Forráskód ellenőrzése

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tesztek (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.x"]
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - name: Forrás letöltése
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node.js 24
        with:
          persist-credentials: false
      - name: Python telepítése
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node.js 24
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-email.txt
      - name: Függőségek telepítése
        run: python -m pip install -r requirements.txt -r requirements-email.txt
      - name: Tesztek (felhőhívás és levélküldés nélkül)
        run: python -m unittest discover -s tests -v
